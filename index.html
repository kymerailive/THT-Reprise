<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reprise — The Hollow Tide</title>
<style>
:root{--bg:#0a0c15;--bg2:#0e1120;--panel:#151928;--panel2:#1b2036;
--line:#252b45;--line2:#303757;--text:#e9ecf8;--dim:#8f97b3;--faint:#646d8c;
--head:#f4f6ff;--accent:#7c5cff;--accent2:#4dc3ff;--gold:#f0b34c;
--coral:#ff6b81;--grad:linear-gradient(135deg,#7c5cff,#4dc3ff);
--shadow:0 10px 34px rgba(0,0,0,.45)}
*{box-sizing:border-box}
body{margin:0;color:var(--text);
background:radial-gradient(1100px 640px at 85% -12%,#1b1f3d 0%,var(--bg) 55%),
radial-gradient(900px 600px at -10% 110%,#141a35 0%,var(--bg) 60%),var(--bg);
font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatecard{background:linear-gradient(180deg,var(--panel2),var(--panel));
border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
padding:42px 36px;max-width:430px;width:100%;text-align:center}
.gatecard h1{margin:.2em 0 .1em;font-size:1.4rem;color:var(--head)}
.gatecard p{color:var(--dim);font-size:.95rem;margin:.4em 0 1.4em}
.gatecard input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line2);
background:var(--bg2);color:var(--text);font-size:1rem;text-align:center;letter-spacing:.06em}
.gatecard input:focus{outline:none;border-color:var(--accent);
box-shadow:0 0 0 3px rgba(124,92,255,.22)}
.gatecard button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:12px;
cursor:pointer;background:var(--grad);color:#fff;font-weight:800;font-size:1rem;
box-shadow:0 6px 18px rgba(124,92,255,.35)}
.gatecard .err{color:var(--coral);font-size:.9rem;min-height:1.3em;margin-top:10px}
#app{display:none;max-width:1020px;margin:0 auto;padding:0 20px 120px}
header.top{position:sticky;top:0;z-index:5;background:rgba(10,12,21,.9);
backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
margin:0 -20px;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;color:var(--head)}
.brand .tide{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tabbtn{padding:7px 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;
color:var(--dim);cursor:pointer;font-weight:700;font-size:.92rem;transition:all .15s}
.tabbtn:hover{color:var(--text);border-color:var(--faint)}
.tabbtn.on{background:var(--grad);border-color:transparent;color:#fff;
box-shadow:0 4px 14px rgba(124,92,255,.4)}
.updated{margin-left:auto;color:var(--dim);font-size:.8rem}
h1{color:var(--head);font-size:1.9rem;margin:.9em 0 .2em}
h2{color:var(--head)}
.stat{display:inline-block;background:linear-gradient(180deg,var(--panel2),var(--panel));
border:1px solid var(--line);border-radius:16px;padding:14px 24px;margin:8px 12px 8px 0;
box-shadow:0 4px 16px rgba(0,0,0,.3)}
.stat .v{font-size:1.6rem;font-weight:800;background:var(--grad);
-webkit-background-clip:text;background-clip:text;color:transparent}
.stat.goldv .v{background:none;color:var(--gold)}
.stat .k{color:var(--dim);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.pcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
border-radius:16px;padding:16px 20px;margin:16px 0;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.pcard h2{margin:.1em 0 .2em}
.pmeta{color:var(--dim);font-size:.86rem;margin-bottom:8px}
.pmeta b{color:var(--gold)}
.fsm{font-size:.85rem;font-weight:500}
table{border-collapse:collapse;width:100%;font-size:.9rem;margin:.6em 0;border-radius:12px;overflow:hidden}
th{background:var(--panel2);color:var(--dim);text-align:left;padding:9px 12px;
font-size:.74rem;text-transform:uppercase;letter-spacing:.07em}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:nth-child(odd){background:rgba(255,255,255,.02)}
.muted{color:var(--dim)}
.hint{color:var(--faint);font-size:.82rem;line-height:1.5}
/* ---- the base map ---- */
.livetag{margin-left:10px;font-size:.78rem;color:var(--dim);white-space:nowrap}
.livedot,.offdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.livedot{background:#5ce08a;box-shadow:0 0 8px #5ce08a;animation:lpulse 2.4s infinite}
.offdot{background:var(--faint)}
@keyframes lpulse{50%{opacity:.4}}
.basedesc{color:var(--dim);font-size:.94rem;max-width:70ch}
.bmapwrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
background:#0a0d18;box-shadow:0 8px 26px rgba(0,0,0,.4);margin:14px 0 6px;touch-action:manipulation}
.bground{position:absolute;inset:0;background:
radial-gradient(75% 68% at 50% 52%,#1d2445 0%,#161b34 52%,#10142a 78%,#0b0e1d 100%)}
.bground::after{content:"";position:absolute;left:9%;top:9%;right:9%;bottom:9%;
border:2px dashed rgba(124,92,255,.28);border-radius:50%}
.boverlay{position:absolute;inset:0}
.bhale{position:absolute;transform:translate(-50%,-50%);cursor:pointer;text-align:center;z-index:2}
.bhale .hbox{width:46px;height:36px;margin:0 auto;border-radius:10px;display:flex;
align-items:center;justify-content:center;font-size:17px;
background:linear-gradient(160deg,#262e56,#1a2038);border:1px solid var(--line2);
box-shadow:0 3px 10px rgba(0,0,0,.45);transition:all .15s}
.bhale:hover .hbox{border-color:var(--accent);transform:translateY(-1px)}
.bhale.sel .hbox{outline:2px solid var(--accent);box-shadow:0 0 14px rgba(124,92,255,.55)}
.bhale .hlbl{margin-top:3px;font-size:10.5px;font-weight:700;color:var(--text);
text-shadow:0 1px 4px #000,0 0 8px #000;white-space:nowrap}
.bnpc{position:absolute;width:22px;height:22px;border-radius:50%;z-index:3;
transform:translate(-50%,-50%);background:var(--grad);border:2px solid #fff;color:#fff;
font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;
cursor:pointer;box-shadow:0 0 10px rgba(124,92,255,.55);user-select:none}
.bnpc::after{content:"";position:absolute;inset:-2px;border-radius:50%;
border:2px solid rgba(124,92,255,.8);animation:bping 2.6s ease-out infinite}
@keyframes bping{0%{transform:scale(.6);opacity:.9}80%,100%{transform:scale(2);opacity:0}}
.bnpc.sel{outline:2px solid #fff;box-shadow:0 0 16px rgba(77,195,255,.8)}
.npcprof-head{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.portrait{width:64px;height:64px;border-radius:14px;flex-shrink:0;display:flex;
align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff;
background:var(--grad);overflow:hidden}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.taskline{margin:10px 0 4px;font-size:.92rem}
.taskline .k,.routine .k{display:inline-block;font-size:.7rem;font-weight:800;color:var(--accent2);
text-transform:uppercase;letter-spacing:.09em;margin-right:8px}
.routine{margin:10px 0 2px;font-size:.92rem}
.routine ul{margin:6px 0 0;padding-left:20px;color:var(--dim)}
.routine li{margin:2px 0}
.moverow{display:flex;gap:8px;margin-top:12px}
.moverow select{flex:1;padding:9px 10px;border-radius:10px;border:1px solid var(--line2);
background:var(--bg2);color:var(--text);font:inherit}
.gbtn{padding:9px 20px;border:0;border-radius:10px;background:var(--grad);color:#fff;
font-weight:800;cursor:pointer;font:inherit;box-shadow:0 4px 14px rgba(124,92,255,.35)}
.gbtn:disabled{opacity:.55;cursor:default}
.npclink{color:var(--text);text-decoration:none;border-bottom:1px dotted var(--faint)}
.npcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.npcgrid .pcard{margin:0}

/* ---- NPC detail: blurb, health, abilities ---- */
.npcblurb{margin:10px 0 2px;font-size:14px;line-height:1.55;color:#c7d4e6}
.forgeline{margin-top:2px}
.vitals{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;
  padding-top:12px;border-top:1px solid #1e2c40}
.vitals .k{display:block;font-size:11px;letter-spacing:.5px;
  text-transform:uppercase;color:#7f92ad;margin-bottom:4px}
.vitals .hp b{font-size:22px;color:#6ee7a8}
.vitals .abils{flex:1 1 260px}
.vitals .abils ul{margin:0;padding-left:18px}
.vitals .abils li{margin-bottom:6px;font-size:13.5px;line-height:1.45}
.dmg{margin-left:6px;padding:1px 7px;border-radius:7px;background:#2a1b1b;
  border:1px solid #4b2b2b;color:#e79a9a;font-size:12px}

/* ---- portrait upload (rare and above) ---- */
.facerow{margin-top:12px;padding-top:12px;border-top:1px solid #1e2c40}
.facelab{display:block;font-size:12px;color:#9fb0c9;margin-bottom:7px}
.fc-file{display:block;margin-top:5px;font:inherit;font-size:12.5px;
  color:#c7d4e6;max-width:100%}
.fc-file::file-selector-button{margin-right:9px;padding:7px 12px;
  border-radius:8px;border:1px solid #24344b;background:#131c2b;
  color:#c7d4e6;font:inherit;font-size:12.5px;cursor:pointer}
.lg-go{min-height:40px;padding:8px 18px;margin-top:8px}
.fc-msg{margin-top:7px;font-size:12.5px}
.fc-msg.ok{color:#6ee7a8}
.fc-msg.err{color:#e79a9a}

/* ---- forming a squad from the muster ---- */
.mkrow{margin:0 0 20px;padding:12px;border-radius:12px;background:#0d1420;
  border:1px solid #1e2c40}
.mkrow input{padding:8px 11px;border-radius:9px;background:#0d1420;
  border:1px solid #24344b;color:#e8eef7;font:inherit;font-size:13px;
  margin-right:8px;min-width:200px}
.mkrow .gbtn{margin-right:10px}
.mkrow .hint{margin-top:8px}

/* ---- the squad picker on an NPC's own card ---- */
.sqpick{margin-top:12px;padding-top:12px;border-top:1px solid #1e2c40}
.sqpick select{width:100%;box-sizing:border-box;margin-top:5px;padding:8px 10px;
  border-radius:9px;background:#0d1420;border:1px solid #24344b;color:#e8eef7;
  font:inherit;font-size:13px}
.sqpick select:disabled{opacity:.5}
.sqpick .facelab{margin-top:8px}
.npnew{margin-top:10px;padding:10px;border-radius:10px;background:#0d1420;
  border:1px solid #24344b}
.npnew input,.npnew textarea{width:100%;box-sizing:border-box;margin-top:5px;
  padding:8px 10px;border-radius:9px;background:#101a28;border:1px solid #24344b;
  color:#e8eef7;font:inherit;font-size:13px}
.npnew .gbtn{margin-top:10px;margin-right:10px}
#j-new{margin-top:10px;padding:12px;border-radius:10px;background:#0d1420;
  border:1px solid #24344b}
#j-new .gbtn{margin-right:12px}

/* ---- squads (inside the NPCs tab) ---- */
.sqhead{display:flex;gap:14px;align-items:flex-start}
.sqhead-t{flex:1;min-width:0}
.sqhead h2{margin-top:0}
.sqlogo{width:56px;height:56px;border-radius:14px;flex-shrink:0;display:flex;
  align-items:center;justify-content:center;background:#131c2b;
  border:1px solid #24344b;color:#7f92ad;font-weight:800;font-size:16px;
  overflow:hidden}
.sqlogo img{width:100%;height:100%;object-fit:cover;display:block}
.logorow{margin-top:14px;padding-top:12px;border-top:1px solid #1e2c40}
.muster{margin:0 0 26px;padding-bottom:22px;border-bottom:1px solid #1e2c40}
.muster>h2:first-child{margin-top:0}
.squad h2{display:flex;align-items:center;gap:10px}
.linkbtn{background:none;border:0;padding:0;color:#8fa6c4;font:inherit;
  font-size:12.5px;text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:#c7d4e6}
.sqtag{display:inline-block;padding:1px 9px;border-radius:8px;font-size:12px;
  margin-right:6px;border:1px solid #24344b;background:#131c2b}
.sqtag.walking{color:#e7c98a;border-color:#4b3f2b}
.sqtag.queued{color:#9fb0c9}
.sqtag.home{color:#6ee7a8;border-color:#2b4b3a}
.sqtab{width:100%;margin:10px 0 4px}
.sqtab td{padding:6px 8px 6px 0;vertical-align:middle;border-bottom:1px solid #16202f}
.sqtab select{padding:6px 8px;border-radius:8px;background:#0d1420;
  border:1px solid #24344b;color:#e8eef7;font:inherit;font-size:13px}
.sqadd,.sqsend{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sqadd select,.sqsend select{padding:8px 10px;border-radius:9px;background:#0d1420;
  border:1px solid #24344b;color:#e8eef7;font:inherit;font-size:13px;max-width:100%}
.whorow{display:block;margin:0 0 14px;font-size:13px;color:#9fb0c9}
.whorow input{width:100%;max-width:320px;box-sizing:border-box;padding:9px 11px;
  border-radius:9px;background:#0d1420;border:1px solid #24344b;color:#e8eef7;
  font:inherit;font-size:14px;display:block;margin-top:5px}

/* ---- the forge ---- */
.pcard label{display:block;margin:12px 0 4px;font-size:13px;color:#9fb0c9}
.pcard input[type=text],.pcard select,.pcard textarea{
  width:100%;box-sizing:border-box;padding:9px 11px;border-radius:9px;
  background:#0d1420;border:1px solid #24344b;color:#e8eef7;
  font:inherit;font-size:14px}
.pcard textarea{resize:vertical;min-height:64px}
.pcard input:focus,.pcard select:focus,.pcard textarea:focus{
  outline:none;border-color:#4d7fb8}
#f-send{margin-top:14px;padding:11px 20px;min-height:44px;border-radius:10px;
  border:none;background:#2f6f4f;color:#fff;font:inherit;font-size:14px;
  font-weight:600;cursor:pointer}
#f-send:disabled{opacity:.6;cursor:default}
.ok{margin-top:10px;color:#6ee7a8;font-size:13px}
</style></head><body>
<div id="gate"><div class="gatecard">
  <h1>Reprise</h1>
  <p>The Hollow Tide — team site. Enter your team's passcode.</p>
  <input id="pw" type="password" autocomplete="off" placeholder="passcode">
  <button id="go">Open</button>
  <div class="err" id="err"></div>
</div></div>
<div id="app">
  <header class="top">
    <span class="brand">Reprise <span class="tide">· The Hollow Tide</span></span>
    <button class="tabbtn on" data-t="team" onclick="pick('team')">Team</button>
    <button class="tabbtn" data-t="players" onclick="pick('players')">Players</button>
    <button class="tabbtn" data-t="base" onclick="pick('base')">Base</button>
    <button class="tabbtn" data-t="npcs" onclick="pick('npcs')">NPCs</button>
    <button class="tabbtn" data-t="forge" id="forgetab" style="display:none"
            onclick="pick('forge')">Forge</button>
    <span class="updated" id="updated"></span>
  </header>
  <div id="main"></div>
</div>

async function unlock(){
  const pw=document.getElementById('pw').value.replace(/\s+/g,'').toLowerCase();
  const err=document.getElementById('err');
  if(!pw){err.textContent='Enter the passcode.';return}
  err.textContent='';
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64buf(ENC.salt),iterations:ENC.iter,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64buf(ENC.iv)},key,b64buf(ENC.ct));
    DATA=JSON.parse(new TextDecoder().decode(pt));
  }catch(e){err.textContent='That passcode does not open this tide.';return}
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  // The Forge tab exists only for a team that has dealt with Kawelo. Teams who
  // haven't never see it — the forge is earned in fiction, not advertised.
  if((DATA.forge||{}).unlocked)document.getElementById('forgetab').style.display='';
  render();
  startLive();
}

    headers:{'Authorization':'Bearer '+DATA.token,

    body:body?JSON.stringify(body):undefined});

async function blobFor(path,key){
  if(BLOBS[key]!==undefined)return BLOBS[key];
  BLOBS[key]='';
  try{
    const r=await fetch(DATA.api+path,{headers:{'Authorization':'Bearer '+DATA.token}});
    if(r.ok)BLOBS[key]=URL.createObjectURL(await r.blob());
  }catch(e){}
  return BLOBS[key];
}
function theBase(){return (liveOk&&LIVE&&LIVE.base)?LIVE.base:DATA.base}
async function pollBase(){
  if(!DATA.api||!DATA.token)return;
  let changed=false;
  try{
    const j=await api('/api/team/base');
    const sig=JSON.stringify(j);
    changed=(sig!==lastSig)||!liveOk;
    lastSig=sig;LIVE=j;liveOk=true;
  }catch(e){changed=liveOk;LIVE=null;liveOk=false}
  if(changed&&(tab==='base'||tab==='npcs'))render();
}
function startLive(){
  if(!DATA.api||!DATA.token)return;
  pollBase();
  setInterval(()=>{if(!document.hidden)pollBase()},10000);
  setInterval(()=>{if(!document.hidden&&tab==='npcs'&&DATA.squads)pollSquads()},15000);
}
function pick(t){tab=t;selHale=null;selNpc=null;render();
  if(t==='base'||t==='npcs')pollBase();
  if(t==='npcs'&&DATA.squads)pollSquads()}
/* ---- squads ----
   A squad is a formation of your own NPCs that marches as one party and holds
   a village. Entirely live: there is nothing to bake, because where a squad is
   standing changes by the minute. */
let SQ=null,sqErr='';
async function pollSquads(){
  try{SQ=await api('/api/team/squads');sqErr=''}
  catch(e){sqErr=e.message}
  if(tab==='squads')render();
}
async function sqCall(path,body){
  try{
    const j=await api(path,body);
    if(j&&j.squads)SQ=j;else await pollSquads();
    sqErr='';
  }catch(e){sqErr=e.message}
  render();
}
function whenText(t){
  const s=Math.max(0,Math.round(t-(Date.now()/1000)));
  if(s<60)return s+'s';
  if(s<3600)return Math.round(s/60)+' min';
  if(s<86400)return Math.round(s/360)/10+' h';
  return Math.round(s/8640)/10+' days';
}
/* Every vocabulary the players own — squads, roles, jobs — is a dropdown with
   its own "add new" entry at the bottom, rather than a separate form sitting
   somewhere else on the page. Picking the last option reveals the fields
   inline, right where you were already looking. */
const NEWOPT='<option value="+">+ New…</option>';
function roleOptions(sel){
  return ['<option value="">— role —</option>']
    .concat((SQ.roles||[]).map(r=>`<option value="${esc(r.name)}"${
      r.name===sel?' selected':''}>${esc(r.name)}</option>`))
    .concat('<option value="+">+ New role…</option>').join('');
}
/* A squad is what LEAVES Final Measure. An NPC who stays isn't in one — they
   simply hold their job there (owner ruling 2026-08-02). So the card offers a
   posting, and the two kinds of posting are the home base or a squad. */
function squadOptions(sel){
  return [`<option value="">At ${esc(SQ.home_name||'base')} — their own job</option>`]
    .concat((SQ.squads||[]).map(s=>`<option value="${esc(s.id)}"${
      s.id===sel?' selected':''}>${esc(s.name)}</option>`))
    .concat('<option value="+">+ New squad…</option>').join('');
}
/* Which squad an NPC stands in, and under what role. */
function squadOf(key){
  return (SQ.squads||[]).find(s=>(s.members||[]).some(m=>m.key===key));
}
function roleOf(key){
  const s=squadOf(key);
  if(!s)return '';
  return ((s.members||[]).find(m=>m.key===key)||{}).role||'';
}
/* The squad controls that ride on an NPC's own card. This is where assigning
   someone actually belongs — you decide a person's posting while looking at
   the person, not by hunting for the squad they aren't in yet. */
function squadPicker(c){
  if(!(DATA.squads&&SQ&&liveOk))return'';
  const mine=squadOf(c.key);
  const marching=mine&&mine.trip;
  if(marching)return `<div class="sqpick"><span class="facelab">Posting</span>
    <div class="pmeta"><b>${esc(mine.name)}</b> — on the road, so their posting
    is fixed until they arrive.</div></div>`;
  // In a squad → they take a role in it. At home → they keep their job, and
  // the only thing left to choose is which hale they work out of.
  const second=mine
    ? `<label class="facelab">Role in the squad
         <select class="np-role">${roleOptions(roleOf(c.key))}</select></label>`
    : `<div class="pmeta muted np-athome">Staying at
         ${esc(SQ.home_name||'base')}${c.forge&&c.forge.job?' as '+esc(c.forge.job):''}${
         c.post?', out of '+esc(c.post):''}.</div>`;
  return `<div class="sqpick" data-npc="${esc(c.key)}">
    <label class="facelab">Posting
      <select class="np-squad">${squadOptions(mine?mine.id:'')}</select></label>
    ${second}
    <div class="npnew" style="display:none"></div>
    <div class="fc-msg muted np-msg"></div></div>`;
}
/* The inline panel a "+ New…" choice opens, for either dropdown. */
function newPanel(kind){
  if(kind==='squad')return `<label class="facelab">Name the squad
    <input type="text" class="nn-name" placeholder="e.g. The Salt Line"></label>
    <button class="gbtn nn-go">Form it</button>
    <button class="linkbtn nn-cancel">cancel</button>`;
  return `<label class="facelab">Name the role
    <input type="text" class="nn-name" placeholder="e.g. Reef Scout"></label>
    <label class="facelab">What do they do?
      <textarea class="nn-desc" rows="2"></textarea></label>
    <button class="gbtn nn-go">Save the role</button>
    <button class="linkbtn nn-cancel">cancel</button>
    <p class="hint">Yours to invent. It joins every squad's dropdown, and the
    devs are told so they can give it teeth.</p>`;
}
function wireSquadPicker(root){
  const box=root.querySelector('.sqpick[data-npc]');
  if(!box)return;
  const key=box.dataset.npc;
  const sq=box.querySelector('.np-squad'), ro=box.querySelector('.np-role');
  const roleVal=()=>(ro&&ro.value!=='+')?ro.value:'';
  const panel=box.querySelector('.npnew'), msg=box.querySelector('.np-msg');
  const close=()=>{panel.style.display='none';panel.innerHTML=''};
  const open=(kind,then)=>{
    panel.innerHTML=newPanel(kind);panel.style.display='';
    const name=panel.querySelector('.nn-name');
    name.focus();
    panel.querySelector('.nn-cancel').onclick=()=>{close();render()};
    panel.querySelector('.nn-go').onclick=()=>{
      const v=name.value.trim();
      if(!v){msg.textContent='Give it a name first.';return}
      then(v,(panel.querySelector('.nn-desc')||{}).value||'');
    };
  };
  sq.onchange=()=>{
    if(sq.value==='+')return open('squad',(name)=>
      sqCall('/api/team/squad',{action:'create',name:name,npc:key,
                                role:roleVal(),player:sqWho()}));
    close();
    if(!sq.value){
      const mine=squadOf(key);
      if(mine)sqCall('/api/team/squad',
        {action:'remove',id:mine.id,npc:key,player:sqWho()});
      return;
    }
    sqCall('/api/team/squad',{action:'add',id:sq.value,npc:key,
      role:roleVal(),player:sqWho()});
  };
  if(ro)ro.onchange=async()=>{
    const mine=squadOf(key);
    if(ro.value==='+')return open('role',async(name,desc)=>{
      try{
        const j=await api('/api/team/role-add',{name:name,desc:desc,player:sqWho()});
        if(SQ)SQ.roles=j.roles||SQ.roles;
        if(mine)await sqCall('/api/team/squad',
          {action:'role',id:mine.id,npc:key,role:name,player:sqWho()});
        else render();
      }catch(e){sqErr=e.message;render()}
    });
    if(!mine){msg.textContent='Put them in a squad first.';return}
    sqCall('/api/team/squad',
      {action:'role',id:mine.id,npc:key,role:ro.value,player:sqWho()});
  };
}
function squadCard(s){
  const rows=(s.members||[]).map(m=>`<tr data-npc="${esc(m.key)}">
    <td><b>${esc(m.name)}</b>${m.job?'<div class="muted fsm">'+esc(m.job)+'</div>':''}</td>
    <td><select class="sq-role">${roleOptions(m.role)}</select></td>
    <td class="muted">${m.hp?esc(m.hp)+' HP':''}</td>
    <td><button class="linkbtn sq-drop">remove</button></td></tr>`).join('')
    ||'<tr><td colspan="4" class="muted">Nobody posted to this squad yet.</td></tr>';
  const free=(SQ.unassigned||[]).map(n=>
    `<option value="${esc(n.key)}">${esc(n.name)}${n.job?' — '+esc(n.job):''}</option>`).join('');
  let status,controls;
  if(s.trip){
    const t=s.trip;
    status=t.state==='queued'
      ? `<span class="sqtag queued">leaves in ${whenText(t.depart)}</span>
         marching to <b>${esc(placeName(t.to))}</b>`
      : `<span class="sqtag walking">on the road</span>
         to <b>${esc(placeName(t.to))}</b> — arrives in ${whenText(t.arrive)}`;
    controls=`<p class="hint">They're already moving. Wait for them to arrive
      before you give a new order.</p>`;
  }else{
    const at=(s.members||[]).map(m=>m.place).filter((v,i,a)=>a.indexOf(v)===i);
    const here=at.length===1?(at[0]?placeName(at[0]):SQ.home_name):
               at.length?'scattered':'—';
    status=`<span class="sqtag home">holding</span> <b>${esc(here)}</b>`;
    controls=`<div class="sqsend">
      <select class="sq-dest">${(SQ.places||[]).map(p=>
        `<option value="${esc(p.key)}">${esc(p.name)}${
          p.minutes!=null?' — '+Math.round(p.minutes/60)+'h from base':''}</option>`).join('')}</select>
      <select class="sq-when">
        <option value="0">Send now</option>
        <option value="1">Send in 1 hour</option>
        <option value="6">Send in 6 hours</option>
        <option value="12">Send in 12 hours</option>
        <option value="24">Send tomorrow</option>
      </select>
      <button class="gbtn sq-go">Send</button>
      <button class="linkbtn sq-home">recall to base</button></div>`;
  }
  return `<div class="pcard squad" data-sq="${esc(s.id)}">
    <div class="sqhead">
      <div class="sqlogo">${esc(initials(s.name))}</div>
      <div class="sqhead-t">
        <h2>${esc(s.name)} <button class="linkbtn sq-kill">disband</button></h2>
        <div class="pmeta">${status}</div>
      </div>
    </div>
    <table class="sqtab"><tbody>${rows}</tbody></table>
    <div class="sqadd">
      <select class="sq-new">${free||'<option value="">everyone is posted</option>'}</select>
      <button class="linkbtn sq-add">post to squad</button></div>
    ${controls}
    <div class="logorow">
      <label class="facelab">${s.logo?'Replace their logo':'Give them a logo'}
        <input type="file" class="lg-file"
               accept="image/png,image/jpeg,image/gif,image/webp"></label>
      <button class="gbtn lg-go">Upload</button>
      <div class="fc-msg muted lg-msg"></div>
      <p class="hint">A picture or a gif, 10MB max — the mark this squad
      carries. It goes with them, and goes when they disband.</p>
    </div></div>`;
}
function placeName(k){
  const p=(SQ&&SQ.places||[]).find(x=>x.key===k);
  return p?p.name:k;
}
function wireSquad(el){
  const sid=el.dataset.sq;
  const q=(s)=>el.querySelector(s);
  const rec=(SQ.squads||[]).find(x=>x.id===sid)||{};
  const badge=q('.sqlogo');
  if(badge&&rec.logo)blobFor('/api/team/squad-logo-img?id='+encodeURIComponent(sid),
                             'squad:'+sid).then(u=>{
    if(u)badge.innerHTML='<img src="'+u+'" alt="">'});
  const lgo=q('.lg-go');
  if(lgo)lgo.onclick=async()=>{
    const msg=q('.lg-msg');
    // classList, not className — the element is re-queried by its .lg-msg
    // hook, and overwriting className would strip that hook off after the
    // first message, leaving the second one with nowhere to land.
    const say=(cls,text)=>{
      msg.classList.remove('muted','ok','err');
      msg.classList.add(cls);msg.textContent=text;
    };
    let pic;
    try{pic=await fileB64(q('.lg-file'))}
    catch(e){say('err',e.message);return}
    if(!pic){say('muted','Pick a file first.');return}
    lgo.disabled=true;lgo.textContent='Uploading…';msg.textContent='';
    try{
      const j=await api('/api/team/squad-logo',
        {id:sid,filename:pic.filename,content_type:pic.content_type,data:pic.data});
      BLOBS['squad:'+sid]=undefined;      // drop the cached old mark
      if(j&&j.squads)SQ=j;
      sqErr='';render();
    }catch(e){
      say('err',e.message);
      lgo.disabled=false;lgo.textContent='Upload';
    }
  };
  el.querySelectorAll('tr[data-npc]').forEach(tr=>{
    const npc=tr.dataset.npc;
    const sel=tr.querySelector('.sq-role');
    if(sel)sel.onchange=()=>sqCall('/api/team/squad',
      {action:'role',id:sid,npc:npc,role:sel.value,player:sqWho()});
    const drop=tr.querySelector('.sq-drop');
    if(drop)drop.onclick=()=>sqCall('/api/team/squad',
      {action:'remove',id:sid,npc:npc,player:sqWho()});
  });
  if(q('.sq-add'))q('.sq-add').onclick=()=>{
    const v=q('.sq-new').value;
    if(v)sqCall('/api/team/squad',{action:'add',id:sid,npc:v,player:sqWho()});
  };
  if(q('.sq-kill'))q('.sq-kill').onclick=()=>{
    if(confirm('Disband this squad? The NPCs stay where they are.'))
      sqCall('/api/team/squad',{action:'disband',id:sid,player:sqWho()});
  };
  if(q('.sq-go'))q('.sq-go').onclick=()=>{
    const hrs=Number(q('.sq-when').value||0);
    sqCall('/api/team/squad-send',{id:sid,place:q('.sq-dest').value,
      depart:hrs?(Date.now()/1000+hrs*3600):0,player:sqWho()});
  };
  if(q('.sq-home'))q('.sq-home').onclick=()=>
    sqCall('/api/team/squad-send',{id:sid,recall:true,player:sqWho()});
}
function sqWho(){
  const el=document.getElementById('sq-who');
  const v=el?el.value.trim():'';
  if(v)try{localStorage.setItem('tht-who',v)}catch(e){}
  return v;
}
function savedWho(){
  try{return localStorage.getItem('tht-who')||''}catch(e){return ''}
}
/* The muster lives inside the NPCs tab — squads are a way of arranging the
   same people the tab already lists, so splitting them across two tabs made
   you hold the roster in your head. Returns HTML; wireSquads attaches it. */
function squadsBlock(){
  if(!(DATA.squads&&DATA.api&&DATA.token))return'';
  if(!SQ)return`<div class="muster"><h2>Squads</h2><p class="muted">`
    +(sqErr?esc(sqErr):'Reading the muster roll…')+`</p></div>`;
  const cards=(SQ.squads||[]).map(squadCard).join('')
    ||`<p class="muted">No squads yet. Name one above, then post people to it —
       or pick <b>+ New squad…</b> straight from any NPC's Posting dropdown,
       which does both at once.</p>`;
  return `<div class="muster">
    <h2>Squads</h2>
    <p class="muted">A squad marches as one party and holds the village it
    arrives at — while they're standing there, that place is yours. Home is
    <b>${esc(SQ.home_name||'base')}</b>.</p>
    <label class="whorow">Your player name
      <input id="sq-who" type="text" value="${esc(savedWho())}"
             placeholder="so the log knows who gave the order"></label>
    <div class="mkrow">
      <input id="sq-name" type="text" placeholder="Name a new squad — e.g. The Salt Line">
      <button class="gbtn" id="sq-make">Form a squad</button>
      <p class="hint">An empty squad is fine. Post people to it from its own
      list below, or from any NPC's Posting dropdown.</p>
    </div>
    ${sqErr?'<div class="err">'+esc(sqErr)+'</div>':''}
    ${cards}</div>`;
}
function wireSquads(m){
  if(!(DATA.squads&&SQ))return;
  m.querySelectorAll('.squad').forEach(wireSquad);
  const name=m.querySelector('#sq-name'), make=m.querySelector('#sq-make');
  const form=()=>{
    const n=(name||{}).value||'';
    if(!n.trim()){sqErr='Name the squad first.';render();return}
    sqCall('/api/team/squad',{action:'create',name:n,player:sqWho()});
  };
  if(make)make.onclick=form;
  if(name)name.addEventListener('keydown',e=>{if(e.key==='Enter')form()});
}
/* ---- base map geometry (ring fallback = the bot's base_map_view math) ---- */
function haleXY(h,i,n,cv){
  if(typeof h.x==='number'&&typeof h.y==='number')return{x:h.x,y:h.y};
  const a=-Math.PI/2+2*Math.PI*i/Math.max(1,n);
  return{x:cv.w/2+cv.w*0.38*Math.cos(a),y:cv.h/2+cv.h*0.36*Math.sin(a)};
}
function liveTag(){
  if(!DATA.token)return'';
  return liveOk?'<span class="livetag"><span class="livedot"></span>live</span>'
               :'<span class="livetag"><span class="offdot"></span>offline — last snapshot</span>';
}
function wirePortrait(el,c){
  if(!el)return;
  if(c.gif){el.innerHTML='<img src="'+esc(c.gif)+'" alt="">';return}
  if(c.image&&liveOk)blobFor('/api/team/npc-image?key='+encodeURIComponent(c.key),'npc:'+c.key)
    .then(u=>{if(u)el.innerHTML='<img src="'+u+'" alt="">'});
}
function npcCard(c,withMove){
  const routine=(c.routine||[]).map(r=>'<li>'+esc(r)+'</li>').join('');
  // Health and what they can do. The bot sends ability NAMES and damage only —
  // never how to beat them (threat notes and kill notes stay dev-side).
  const abil=(c.abilities||[]).map(a=>
    '<li><b>'+esc(a.name)+'</b>'+(a.damage?' <span class="dmg">'+esc(a.damage)+'</span>':'')
    +(a.desc?'<br><span class="muted">'+esc(a.desc)+'</span>':'')+'</li>').join('');
  const vitals=(c.hp||abil)?`<div class="vitals">
    ${c.hp?'<div class="hp"><span class="k">Health</span><b>'+c.hp+'</b></div>':''}
    ${abil?'<div class="abils"><span class="k">Abilities</span><ul>'+abil+'</ul></div>':''}
    </div>`:'';
  const inSquad=DATA.squads&&SQ&&liveOk&&!!squadOf(c.key);
  const move=(withMove&&liveOk&&!inSquad)?`
    <div class="moverow"><select class="mv-house">${(theBase().houses||[])
      .map(h=>'<option '+(h.name===c.post?'selected':'')+'>'+esc(h.name)+'</option>').join('')}</select>
    <button class="gbtn mv-go">Move</button></div>
    <p class="hint">Tasks and routines are set by the devs — you can move your
    NPC between hale, not rewrite their day.</p>`:'';
  return `<div class="pcard npcprof" data-npc="${esc(c.key)}">
    <div class="npcprof-head">
      <div class="portrait">${esc(initials(c.name))}</div>
      <div><h2>${esc(c.name)}</h2>
        <div class="pmeta">${(c.titles||[]).length?esc(c.titles.join(', '))+' · ':''}${esc(c.affiliation||'')}</div>
        <div class="pmeta">Post: <b>${esc(c.post||'—')}</b>${c.function?' <span class="muted">('+esc(c.function)+')</span>':''}</div>
        ${c.away?'<div class="pmeta"><span class="sqtag walking">away</span>'+esc(c.away)+'</div>':''}
        ${c.squad?'<div class="pmeta muted">🛡️ '+esc(c.squad)+(c.squad_role?' · '+esc(c.squad_role):'')+'</div>':''}
      </div></div>
    ${squadPicker(c)}
    ${c.forge&&c.forge.owner?'<div class="pmeta forgeline">🜲 forged by <b>'
      +esc(c.forge.owner)+'</b>'+(c.forge.rarity?' · '+esc(c.forge.rarity):'')
      +(c.forge.job?' · '+esc(c.forge.job):'')+'</div>':''}
    ${c.blurb?'<div class="npcblurb">'+esc(c.blurb)+'</div>':''}
    ${vitals}
    ${c.task?'<div class="taskline"><span class="k">Current task</span>'+esc(c.task)+'</div>':''}
    ${routine?'<div class="routine"><span class="k">Routine</span><ul>'+routine+'</ul></div>':''}
    ${(!c.task&&!routine)?'<p class="muted fsm">No task or routine on record yet.</p>':''}
    ${move}</div>`;
}
function wireNpcCard(root,c){
  wirePortrait(root.querySelector('.portrait'),c);
  wireSquadPicker(root);
  const go=root.querySelector('.mv-go');
  if(go)go.onclick=async()=>{
    const house=root.querySelector('.mv-house').value;
    go.disabled=true;go.textContent='Moving…';
    try{await api('/api/team/base-npc',{npc:c.key,house});lastSig='';await pollBase()}
    catch(e){alert(e.message);go.disabled=false;go.textContent='Move'}
  };
}
function renderBase(m){
  const b=theBase();
  if(!b){m.innerHTML='<h1>Base</h1><p class="muted">No base on record for this team — yet.</p>';return}
  const cv=b.canvas||{w:1200,h:800};
  const pct=(v,a)=>(v/(a==='x'?cv.w:cv.h)*100)+'%';
  const n=(b.houses||[]).length;
  let marks='';
  (b.houses||[]).forEach((h,i)=>{
    const p=haleXY(h,i,n,cv);
    marks+=`<div class="bhale${selHale===h.name?' sel':''}" data-hale="${esc(h.name)}"
      style="left:${pct(p.x,'x')};top:${pct(p.y,'y')}">
      <div class="hbox">⌂</div><div class="hlbl">${esc(h.name)}</div></div>`;
    (h.npcs||[]).forEach((k,j)=>{
      const c=(b.npcs||{})[k];if(!c)return;
      const dx=p.x-26+(j%3)*26,dy=p.y+34+Math.floor(j/3)*26;
      marks+=`<div class="bnpc${selNpc===k?' sel':''}" data-npc="${esc(k)}"
        title="${esc(c.name)} — ${esc(h.name)}"
        style="left:${pct(dx,'x')};top:${pct(dy,'y')}">${esc(initials(c.name))}</div>`;
    });
  });
  m.innerHTML=`<h1>${esc(b.name)}</h1>
    <div class="pmeta">${b.status?'📍 <b>'+esc(b.status)+'</b>':''}
      ${b.steward?' · Steward: <b>'+esc(b.steward)+'</b>':''}${liveTag()}</div>
    ${b.desc?'<p class="basedesc">'+esc(b.desc)+'</p>':''}
    <div class="bmapwrap" style="aspect-ratio:${cv.w} / ${cv.h}">
      <div class="bground" id="bground"></div>
      <div class="boverlay">${marks}</div>
    </div>
    <p class="hint">Every glowing dot is one of your NPCs, live from the island —
    tap a house or a dot for details.${liveOk?' You can move your NPCs between hale from their card.':''}</p>
    <div id="bpanel"></div>`;
  if(b.image&&liveOk)blobFor('/api/team/base-image','plan:'+(b.key||''))
    .then(u=>{const g=document.getElementById('bground');
      if(u&&g)g.style.cssText='background:url('+u+') center/cover no-repeat'});
  m.querySelectorAll('.bhale').forEach(el=>el.onclick=()=>{
    selHale=el.dataset.hale===selHale?null:el.dataset.hale;selNpc=null;render()});
  m.querySelectorAll('.bnpc').forEach(el=>el.onclick=e=>{e.stopPropagation();
    selNpc=el.dataset.npc===selNpc?null:el.dataset.npc;selHale=null;render()});
  const box=m.querySelector('#bpanel');
  if(selNpc){
    const c=(b.npcs||{})[selNpc];
    if(c){box.innerHTML=npcCard(c,true);wireNpcCard(box.firstElementChild,c)}
  }else if(selHale){
    const h=(b.houses||[]).find(x=>x.name===selHale);
    if(h){box.innerHTML=`<div class="pcard"><h2>${esc(h.name)}${h.function?' <span class="muted fsm">— '+esc(h.function)+'</span>':''}</h2>
      ${(h.npcs||[]).length?'<div class="pmeta">'+h.npcs.map(k=>{const c=(b.npcs||{})[k];
        return '<a href="#" class="npclink" data-npc="'+esc(k)+'"><b>'+esc(c?c.name:k)+'</b></a>'}).join(' · ')+'</div>'
        :'<div class="pmeta muted">No one stationed here right now.</div>'}
      ${h.staff?'<div class="pmeta muted">Also: '+esc(h.staff)+'</div>':''}</div>`;
      box.querySelectorAll('.npclink').forEach(a=>a.onclick=e=>{e.preventDefault();
        selNpc=a.dataset.npc;selHale=null;render()});
    }
  }
}
function render(){
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  document.getElementById('updated').textContent='updated '+DATA.updated;
  const m=document.getElementById('main');
  if(tab==='team'){
    const roster=DATA.players.map(p=>`<tr><td><b>${esc(p.name)}</b></td>
      <td class="muted">${esc(p.pronouns)}</td><td>${esc(p.label)}</td>
      <td class="muted">${esc((p.titles||[]).join(', '))}</td></tr>`).join('');
    const stash=DATA.stash.length?DATA.stash.map(i=>`<tr><td>${esc(i.name)}</td>
      <td>×${i.qty}</td><td class="muted">${esc(i.desc||'')}</td></tr>`).join('')
      :'<tr><td colspan="3" class="muted">The stash is empty.</td></tr>';
    m.innerHTML=`<h1>${esc(DATA.team)}</h1>
      <div><span class="stat goldv"><div class="v">${money(DATA.treasury)}</div><div class="k">Team Bank</div></span>
      <span class="stat"><div class="v">${DATA.players.length}</div><div class="k">Players</div></span>
      <span class="stat"><div class="v">${DATA.stash.length}</div><div class="k">Stash items</div></span></div>
      <h2>Roster</h2><table><thead><tr><th>Name</th><th>Pronouns</th><th>Label</th><th>Titles</th></tr></thead>
      <tbody>${roster}</tbody></table>
      <h2>Team stash</h2><table><thead><tr><th>Item</th><th>Qty</th><th>About</th></tr></thead>
      <tbody>${stash}</tbody></table>`;
  }else if(tab==='base'){
    renderBase(m);
  }else if(tab==='npcs'){
    const b=theBase();
    const cards=b?Object.values(b.npcs||{}).sort((a,c)=>a.name.localeCompare(c.name)):[];
    const roster=cards.length
      ? `<h2>Everyone at ${esc(b.name)}</h2>
         <div class="npcgrid">${cards.map(c=>npcCard(c,true)).join('')}</div>`
      : '<p class="muted">No NPCs stationed at your base — yet.</p>';
    m.innerHTML=`<h1>NPCs${liveTag()}</h1>${squadsBlock()}${roster}`;
    wireSquads(m);
    m.querySelectorAll('.npcprof').forEach(el=>{
      const c=(b.npcs||{})[el.dataset.npc];
      if(c){wireNpcCard(el,c);
        el.style.cursor='pointer';
        el.onclick=e=>{if(e.target.closest('.moverow,.sqpick,a'))return;
          tab='base';selNpc=c.key;selHale=null;render();
          document.querySelectorAll('.tabbtn').forEach(x=>x.classList.toggle('on',x.dataset.t==='base'))};
      }});
  }else if(tab==='forge'){
    m.innerHTML='<h1>The Forge</h1>'+forgeForm();
  }else{
    m.innerHTML='<h1>Players</h1>'+DATA.players.map(p=>{
      const sk=Object.entries(p.skills||{}).filter(e=>e[1]>0)
        .map(e=>e[0].charAt(0).toUpperCase()+e[0].slice(1)+' '+(['','I','II','III','IV','V'][e[1]]||e[1])).join(' · ');
      const inv=(p.inventory||[]).map(i=>`<tr><td>${esc(i.name)}</td><td>×${i.qty}</td>
        <td class="muted">${esc(i.desc||'')}</td></tr>`).join('')
        ||'<tr><td colspan="3" class="muted">Empty bag.</td></tr>';
      return `<div class="pcard"><h2>${esc(p.name)}</h2>
        <div class="pmeta">${esc(p.pronouns)}${p.pronouns?' · ':''}<b>${esc(p.label)}</b>
        ${p.affiliation?' · '+esc(p.affiliation):''}
        ${(p.titles||[]).length?' · '+esc(p.titles.join(', ')):''}</div>
        <div class="pmeta">💰 ${money(p.wallet)}${sk?' · 🎓 '+esc(sk):''}</div>
        <table><thead><tr><th>Item</th><th>Qty</th><th>About</th></tr></thead><tbody>${inv}</tbody></table>
        </div>`;}).join('');
  }
}

/* ---- the forge ----
   Buy a card from Kawelo, author the NPC here, a dev rules on it. The form
   shows only the fields that card pays for, and only the jobs still open. */
function forgeRarity(){
  const s=document.getElementById('f-rarity');
  return s?s.value:'common';
}
function forgeForm(){
  const F=DATA.forge||{}, r=forgeRarity();
  const fields=(F.fields||{})[r]||[];
  const jobs=(F.jobs||[]).filter(j=>r==='special'||
      (F.tiers||[]).indexOf(j.tier)<=(F.tiers||[]).indexOf(r));
  const rows=fields.map(f=>{
    if(f==='job'){
      const opts=jobs.map(j=>`<option value="${esc(j.title)}">${esc(j.title)}`
        +` — ${esc(j.tier)}${j.left!==null&&j.left!==undefined?' ('+j.left+' left)':''}`
        +`</option>`).join('');
      // Writing a job is the last entry in the same dropdown you pick one
      // from, not a form elsewhere on the page.
      return `<label>${esc((F.prompts||{}).job||'Job')}
        <select id="f-job" onchange="jobPick()">${opts||'<option value="">no posts open</option>'}
        <option value="+">+ Add a job…</option></select></label>
        <div id="j-new" style="display:none">
          <label>Job title<input id="j-title" type="text" placeholder="e.g. Reef Warden"></label>
          <label>What does the job actually do?<textarea id="j-desc" rows="3"
            placeholder="A sentence or two — enough for a dev to tier it fairly."></textarea></label>
          <label>Which tier are you asking for?
            <select id="j-tier"><option value="">choose…</option>
            ${(F.tiers||[]).map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('')}
            </select></label>
          <button class="gbtn" id="j-send" onclick="jobSend()">Propose it</button>
          <button class="linkbtn" onclick="jobPick(true)">cancel</button>
          <p class="hint">The tier is what decides which cards may hire the job:
          a card can take a job of its own tier or below, so the higher you ask,
          the rarer the card it takes. A dev has the final say on that and on how
          many can exist. Once they've ruled it's in this dropdown for good —
          it can't be used on the card you're forging right now.</p>
          <div class="err" id="j-err"></div>
        </div>`;
    }
    const big=['personality','voice','backstory','goal','ability','trait'].indexOf(f)>=0;
    const p=esc((F.prompts||{})[f]||f);
    return big?`<label>${p}<textarea id="f-${f}" rows="3"></textarea></label>`
              :`<label>${p}<input id="f-${f}" type="text"></label>`;
  }).join('');
  // Rare and above choose their own face, so the picture rides WITH the
  // submission — it used to be handed to a dev out of band, which is why so
  // many forged NPCs ended up wearing a pool face they never picked.
  const face=(F.portrait||[]).indexOf(r)>=0
    ? `<div class="facerow"><label class="facelab">Their face — a picture or a gif
         <input type="file" id="f-face" class="fc-file"
                accept="image/png,image/jpeg,image/gif,image/webp">
       </label>
       <p class="hint">Optional, 10MB max. Send one and it's theirs the moment a
       dev approves the card; skip it and they're given one from the pool.</p></div>`
    : `<p class="muted">The card picks their face from the pool.</p>`;
  const pend=(F.pending_jobs||[]).length
    ? `<p class="hint">Waiting on a dev: ${(F.pending_jobs||[])
        .map(j=>esc(j.title)).join(', ')}.</p>` : '';
  return `<div class="pcard"><h2>Forge an NPC</h2>
    <p class="muted">${esc((F.blurb||{})[r]||'')}</p>
    <label>Which card are you spending?
      <select id="f-rarity" onchange="render()">
        ${['common','uncommon','rare','legendary','special'].map(x=>
          `<option value="${x}"${x===r?' selected':''}>${x}</option>`).join('')}
      </select></label>
    <label>Your player name<input id="f-player" type="text"
      placeholder="so the NPC knows who their creator is"></label>
    ${rows}${face}
    <button id="f-send" onclick="forgeSend()">Send to the devs</button>
    <div class="err" id="f-err"></div>${pend}</div>`;
}
/* "+ Add a job…" is a choice in the job dropdown; picking it opens the fields
   underneath and parks the select on nothing, so a proposal can never be
   mistaken for the job this card is hiring. */
function jobPick(cancel){
  const sel=document.getElementById('f-job'), box=document.getElementById('j-new');
  if(!sel||!box)return;
  if(cancel||sel.value!=='+'){
    box.style.display='none';
    if(cancel)sel.selectedIndex=0;
    return;
  }
  box.style.display='';
  const t=document.getElementById('j-title');
  if(t)t.focus();
}
async function fileB64(el){
  const f=el&&el.files&&el.files[0];
  if(!f)return null;
  if(f.size>10*1024*1024)throw new Error('That picture is over 10MB.');
  const b64=await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]||'');
    r.onerror=()=>rej(new Error('could not read that file'));
    r.readAsDataURL(f);
  });
  return {data:b64,filename:f.name,content_type:f.type};
}
async function jobSend(){
  const err=document.getElementById('j-err'), btn=document.getElementById('j-send');
  const tier=(document.getElementById('j-tier')||{}).value||'';
  // Asked for here rather than left to the devs to guess, because a player who
  // isn't given the field writes it into the title instead.
  if(!tier){err.className='err';
            err.textContent='Say which tier the job should be.';return}
  btn.disabled=true;btn.textContent='Sending…';
  try{
    await api('/api/team/job-propose',{
      title:(document.getElementById('j-title')||{}).value||'',
      description:(document.getElementById('j-desc')||{}).value||'',
      tier:tier,
      player:(document.getElementById('f-player')||{}).value||''});
    err.className='ok';
    err.textContent='Sent. A dev rules on the tier, and then it joins the list.';
    ['j-title','j-desc'].forEach(i=>{const e=document.getElementById(i);if(e)e.value=''});
    const ts=document.getElementById('j-tier');if(ts)ts.selectedIndex=0;
    jobPick(true);
  }catch(e){err.className='err';err.textContent=e.message}
  btn.disabled=false;btn.textContent='Propose it';
}
async function forgeSend(){
  const F=DATA.forge||{}, r=forgeRarity();
  const err=document.getElementById('f-err');
  const body={rarity:r,player:(document.getElementById('f-player')||{}).value||''};
  ((F.fields||{})[r]||[]).forEach(f=>{
    const el=document.getElementById('f-'+f);
    if(el)body[f]=(el.value==='+'?'':el.value);
  });
  body.portrait=(F.portrait||[]).indexOf(r)>=0;
  const btn=document.getElementById('f-send');
  if(btn){btn.disabled=true;btn.textContent='Sending…';}
  try{
    if(body.portrait){
      const pic=await fileB64(document.getElementById('f-face'));
      if(pic){body.image=pic.data;body.filename=pic.filename;
              body.content_type=pic.content_type}
    }
    await api('/api/team/forge-submit',body);
    err.className='ok';
    err.textContent='Sent. A dev will confirm your card and make them real.';
  }catch(e){
    err.className='err';
    err.textContent=e.message;
    if(btn){btn.disabled=false;btn.textContent='Send to the devs';}
  }
}
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('go').onclick=unlock;
  document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});
});
